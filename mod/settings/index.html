<!doctype html>
<!-- Item Repair Hub v2.3.1 -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Item Repair Hub</title><link rel="stylesheet" href="style-v2.3.1.css"></head><body>
<header><div><span class="eyebrow">RAGNAROK OFFLINE · RENEWAL</span><h1>Item Repair Hub <span class="version">v2.3.1</span></h1><p id="context">Included repairs · full editor is inside the game</p></div><div id="total" class="total"></div></header>
<p id="warning" class="warning" hidden></p>
<p class="notice">To add items or edit skills, open Item Repairs inside the game. This Settings page manages the included repairs only.</p><section class="toolbar" aria-label="Find repairs"><label class="search"><span>Search repairs</span><input id="search" type="search" placeholder="Name, item ID, or Divine Pride link" autocomplete="off"></label><label><span>Category</span><select id="category"><option value="all">All categories</option><option value="equipment">Equipment access</option><option value="effects">Bonuses & autocasts</option><option value="permissions">Trade & storage</option></select></label><label><span>Show</span><select id="filter"><option value="all">All fixes</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option><option value="changed">Unsaved changes</option></select></label></section>
<div class="workspace"><aside aria-label="Repair collection"><div class="list-heading"><strong>Repair collection</strong><span id="result-count"></span></div><div id="list"></div><div id="pager" class="pager"><button id="previous" aria-label="Previous page">←</button><span id="page-count"></span><button id="next" aria-label="Next page">→</button></div></aside><main id="detail" tabindex="-1" aria-label="Selected repair"></main></div>
<footer><div><strong id="status" role="status" aria-live="polite">Loading…</strong><small id="save-note">Save here, then use Apply & restart in the app.</small></div><div class="actions"><button id="revert" disabled>Revert unsaved</button><button id="save" class="primary" disabled>Save changes</button><button id="apply" hidden disabled></button></div></footer>
<script src="model-v2.3.1.js"></script><script src="app-v2.3.1.js"></script></body></html>
